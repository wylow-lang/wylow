<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VPL Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="mark">VPL</span>
        <span class="sub">testing dashboard</span>
      </div>
      <nav id="nav">
        <a href="#/overview" data-page="overview">Overview</a>
        <a href="#/tests" data-page="tests">Tests</a>
        <a href="#/fuzz" data-page="fuzz">Fuzz</a>
        <a href="#/findings" data-page="findings">Findings</a>
        <a href="#/reference" data-page="reference">Reference</a>
      </nav>
      <div class="sidebar-foot" id="sidebarStatus"></div>
    </aside>
    <main>
      <header class="topbar">
        <h1 id="pageTitle">Overview</h1>
        <div id="topMeta" class="muted small"></div>
      </header>
      <div id="view"></div>
    </main>
  </div>

  <dialog id="dialog">
    <header class="dialog-head">
      <strong id="dialogTitle"></strong>
      <span class="dialog-buttons">
        <button id="dialogCopy" class="small">Copy</button>
        <button id="dialogClose" class="small">Close</button>
      </span>
    </header>
    <pre id="dialogBody"></pre>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
