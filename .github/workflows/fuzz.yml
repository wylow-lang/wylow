# Fuzzes the compiler nightly, a new seed each run. A finding fails the job and is uploaded as an
# artifact; it becomes a test in tests/cases/ like a local finding.
name: Fuzz

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per tier
        default: "1800"
      seed:
        description: Seed (empty for the run number)
        default: ""

jobs:
  fuzz:
    name: tier ${{ matrix.tier }}
    runs-on: windows-2025
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        tier: [1, 2]
    env:
      SECONDS_BUDGET: ${{ inputs.seconds || '1800' }}
      SEED: ${{ inputs.seed || github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build
      - name: Fuzz
        shell: pwsh
        run: dotnet tests/Wyl.Fuzz/bin/Debug/net10.0/Wyl.Fuzz.dll --tier ${{ matrix.tier }} --seed $env:SEED --seconds $env:SECONDS_BUDGET --jobs $env:NUMBER_OF_PROCESSORS
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: findings-tier${{ matrix.tier }}-seed${{ env.SEED }}
          path: tests/fuzz/findings/
