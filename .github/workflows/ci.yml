# The suite in every mode, one runner per mode, on every push to dev or main, and the generator's
# self-check, so a change that breaks the generator fails the push instead of the nightly run. The
# runner images are pinned, because the oldest supported compiler versions are the versions that
# these images have (decision 0098).
name: CI

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.mode }}
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: clang, args: "--cc clang" }
          - { mode: gcc, args: "--cc gcc" }
          - { mode: no-opt, args: "--no-opt" }
          - { mode: no-nest, args: "--no-nest" }
          - { mode: asan, args: "--cc asan" }
          # Declining to nest changes which temporaries live how long, so a use after free can hide
          # in this combination alone; the un-sanitized --no-nest run can print the old bytes and pass.
          - { mode: asan-no-nest, args: "--cc asan --no-nest" }
          - { mode: interpret, args: "--interpret" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Toolchains
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property catalog_productDisplayVersion
          g++ --version | Select-Object -First 1
      - run: dotnet build
      - name: Test (${{ matrix.mode }})
        shell: pwsh
        run: dotnet tests/Wyl.Tests/bin/Debug/net10.0/Wyl.Tests.dll ${{ matrix.args }} --jobs $env:NUMBER_OF_PROCESSORS

  generator:
    name: generator self-check
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build
      - name: Self-check
        shell: pwsh
        run: dotnet tests/Wyl.Generate/bin/Debug/net10.0/Wyl.Generate.dll --self-test

  gcc-linux:
    name: gcc (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Toolchain
        run: g++ --version
      - run: dotnet build
      - name: Test (gcc)
        run: dotnet tests/Wyl.Tests/bin/Debug/net10.0/Wyl.Tests.dll --cc gcc --jobs $(nproc)

  tsan:
    name: tsan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Toolchain
        run: |
          clang++ --version
          g++ --version
          sudo sysctl -w vm.mmap_rnd_bits=28 || true
      - run: dotnet build
      - name: Test (tsan)
        run: dotnet tests/Wyl.Tests/bin/Debug/net10.0/Wyl.Tests.dll --cc tsan --jobs $(nproc)
